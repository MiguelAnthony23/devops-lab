server {
    listen 80;
    server_name _;

    location = / {
        default_type text/plain;
        return 200 "Mission 009 web service is responding.\n";
    }

    location = /healthz {
        default_type text/plain;
        if (!-f /tmp/mission-009-healthy) {
            return 503 "Application health check failed.\n";
        }
        return 200 "Application is healthy.\n";
    }
}
